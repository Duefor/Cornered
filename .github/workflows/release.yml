name: Release

# 打一个 v* 标签 -> 自动构建签名 APK -> 建 GitHub Release 并挂上 APK。
# 应用内的「检查更新」就是读这个 Release（最新的正式版）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签（如 v1.0.1），用于重新发布同一个版本'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # 主*10000 + 次*100 + 修订，必须与 app/build.gradle.kts 的编码方式一致
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "解析版本：$VERSION (versionCode=$CODE)"

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "已载入发布签名"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::仓库没有配置 KEYSTORE_BASE64，本次 APK 由 debug 签名，仅供试玩，无法覆盖安装后续版本"
          fi

      - name: Build release APK
        env:
          CORNERED_KEYSTORE: ${{ runner.temp }}/release.jks
          CORNERED_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CORNERED_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CORNERED_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pcornered.versionName=${{ steps.version.outputs.version }} \
            -Pcornered.versionCode=${{ steps.version.outputs.code }} \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/Cornered-${{ steps.version.outputs.version }}.apk"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cornered-${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cornered ${{ steps.version.outputs.version }}
          body: |
            下载 `Cornered-${{ steps.version.outputs.version }}.apk` 安装即可。
            已安装旧版本的，可以直接在游戏里点「检查更新」升级，无需手动下载。

            - versionName: `${{ steps.version.outputs.version }}`
            - versionCode: `${{ steps.version.outputs.code }}`
            - 签名: ${{ steps.keystore.outputs.ready == 'true' && 'release keystore' || 'debug（仅试玩）' }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
